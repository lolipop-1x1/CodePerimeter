name: Component checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos-components:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -B -m unittest discover -s tests -p test_synthetic_sender.py -v
      - run: python3 -B scripts/validate-selftest.py
      - name: Validation entry syntax
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('validate-*.py')]"
