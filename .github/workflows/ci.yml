name: Component checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos-components:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies without lifecycle scripts
        working-directory: web
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Web type checks
        working-directory: web
        run: npm run typecheck
      - name: Web component tests
        working-directory: web
        run: npm test
      - name: Build embedded web assets
        working-directory: web
        run: npm run build
      - name: Verify tracked web assets match source
        run: |
          git ls-files --error-unmatch web/dist/index.html > /dev/null
          git diff --exit-code --quiet -- web/dist
          python3 -B -c "import subprocess; files=subprocess.check_output(['git','ls-files','--others','--exclude-standard','--','web/dist']).splitlines(); assert not files, '网页构建产生未跟踪资源，请更新构建产物'"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -B -m unittest discover -s tests -p test_synthetic_sender.py -v
      - run: python3 -B scripts/validate-selftest.py
      - run: python3 -B scripts/validate-archive-selftest.py
      - name: Validation entry syntax
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('validate-*.py')]"
