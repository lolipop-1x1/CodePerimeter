[package]
name = "codeperimeter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "macOS 项目文件活动与归档迹象监控"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
